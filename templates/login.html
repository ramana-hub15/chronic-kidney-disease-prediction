{% extends "base.html" %}

{% block content %}
<div class="login-container">
    <div class="text-center mb-4">
        <i class="fa-solid fa-hospital fa-3x text-primary mb-3"></i>
        <h2 class="fw-bold">Medical Staff Portal</h2>
        <p class="text-muted">Sign in to access the CKD Prediction System</p>
    </div>
    
    <div class="card shadow-sm border-0">
        <div class="card-body p-4">
            <form method="POST" action="{{ url_for('login') }}">
                <div class="mb-3">
                    <label for="username" class="form-label fw-semibold">Username</label>
                    <div class="input-group">
                        <span class="input-group-text bg-light"><i class="fa-solid fa-user"></i></span>
                        <input type="text" class="form-control" id="username" name="username" required placeholder="Enter your username">
                    </div>
                </div>
                <div class="mb-4">
                    <label for="password" class="form-label fw-semibold">Password</label>
                    <div class="input-group">
                        <span class="input-group-text bg-light"><i class="fa-solid fa-lock"></i></span>
                        <input type="password" class="form-control" id="password" name="password" required placeholder="Enter your password">
                    </div>
                </div>
                <button type="submit" class="btn btn-primary w-100 py-2 fs-5">Secure Login <i class="fa-solid fa-arrow-right ms-2"></i></button>
            </form>
        </div>
    </div>
    <div class="text-center mt-3">
        <small class="text-muted"><i class="fa-solid fa-shield-halved text-success me-1"></i> Hospital Grade Secure System</small>
    </div>
</div>
{% endblock %}
